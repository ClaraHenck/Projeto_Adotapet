<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet - Minhas Candidaturas</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* Classes adicionais específicas para organizar os cards de candidaturas */
        .candidaturas-container {
            max-width: 800px;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .candidatura-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid #eee;
        }
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .status-analise {
            background-color: #FFF4E5;
            color: #FF9800;
        }
        .status-aprovado {
            background-color: #E6F9F3;
            color: #00B67A;
        }
        .no-data {
            text-align: center;
            color: #7A7E85;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO IDÊNTICO E INTEGRADO -->
    <header class="main-header">
        <div class="logo">
            <span class="paw-icon">🐾</span>
            <h1>AdotaPet</h1>
        </div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="adotar.html">Adotar</a>
            <a href="mapa.html">Mapa</a>
            <a href="candidaturas.html" class="active">Candidaturas</a>
            
            <div class="profile-section">
                <span class="profile-pic">👤</span>
                <span class="meu_perfil.html">MEU PERFIL</span>
            </div>
            <a href="login.html">Sair</a>
        </nav>
    </header>

    <!-- LISTAGEM DE SOLICITAÇÕES -->
    <main class="content-wrapper">
        <h2 class="page-title">Minhas Candidaturas</h2>
        <p class="subtitle">Acompanhe abaixo o status dos seus pedidos enviados às ONGs.</p>

        <div class="candidaturas-container" id="lista-candidaturas">
            <!-- Inserido dinamicamente via JS -->
        </div>
    </main>

    <script>
        function carregarCandidaturas() {
            const container = document.getElementById('lista-candidaturas');
            
            // Lê as candidaturas que foram salvas ao clicar no botão "Adotar"
            const candidaturas = JSON.parse(localStorage.getItem('minhasCandidaturas')) || [];

            if (candidaturas.length === 0) {
                container.innerHTML = '<p class="no-data">Você ainda não enviou nenhuma candidatura de adoção.</p>';
                return;
            }

            container.innerHTML = candidaturas.map(cand => {
                // Alterna o estilo e texto de acordo com a aprovação da ONG
                const classeStatus = cand.status === 'aprovado' ? 'status-aprovado' : 'status-analise';
                const textoStatus = cand.status === 'aprovado' ? 'Aprovado pela ONG' : 'Em Análise';
                const icone = cand.petEspecie.includes('Gato') ? '🐱' : '🐶';

                return `
                    <div class="candidatura-card">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <div style="font-size: 30px;">${icone}</div>
                            <div>
                                <h3 style="margin: 0; font-size: 18px;">${cand.petNome}</h3>
                                <p style="margin: 2px 0 0 0; color: #7A7E85; font-size: 14px;">${cand.petEspecie} • Enviado em ${cand.dataEnvio}</p>
                            </div>
                        </div>
                        <div>
                            <span class="status-badge ${classeStatus}">${textoStatus}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Executa a busca assim que a página abre
        window.onload = carregarCandidaturas;
    </script>
</body>
</html>
