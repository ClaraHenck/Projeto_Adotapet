<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet - Meu Perfil</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="footer.js"></script>
    <style>
        /* Estilos adicionais e específicos para a página de perfil */
        .profile-container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        .avatar-upload-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .avatar-preview-container {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .avatar-preview {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #E2E8F0;
            border: 3px solid #00C1DE;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #7A7E85;
            overflow: hidden;
        }

        .btn-upload-label {
            background-color: #00C1DE;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-upload-label:hover {
            background-color: #00A9C4;
        }

        #avatar-input {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: #2D2D2D;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #CBD5E1;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #00C1DE;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .btn-save-profile {
            background-color: #00C1DE;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-save-profile:hover {
            background-color: #00A9C4;
        }

        .success-message {
            display: none;
            background-color: #E6F9F3;
            color: #00B67A;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO PADRÃO IDENTICO -->
    <header class="main-header">
        <div class="logo">
            <span class="paw-icon">🐾</span>
            <h1>AdotaPet</h1>
        </div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="adotar.html">Adotar</a>
            <a href="mapa.html">Mapa</a>
            <a href="candidaturas.html">Candidaturas</a>
            <div class="profile-section">
                <span class="profile-pic" id="header-avatar-mini">👤</span>
                <!-- Corrigido para link <a> real redirecionando para este arquivo -->
                <a href="meu_perfil.html" class="active" style="text-decoration: none; color: inherit; font-weight: 600;">MEU PERFIL</a>
            </div>
            <a href="login.html">Sair</a>
        </nav>
    </header>

    <!-- FORMULÁRIO DE PERFIL -->
    <main class="content-wrapper">
        <h2 class="page-title" style="text-align: center;">Meu Perfil</h2>
        <p class="subtitle" style="text-align: center;">Mantenha suas informações atualizadas para os processos de adoção.</p>

        <div class="profile-container">
            <div id="success-alert" class="success-message">Alterações salvas com sucesso!</div>

            <!-- Upload da Foto de Perfil -->
            <div class="avatar-upload-wrapper">
                <div class="avatar-preview-container">
                    <div id="avatar-preview" class="avatar-preview">👤</div>
                </div>
                <label for="avatar-input" class="btn-upload-label">Alterar Foto</label>
                <input type="file" id="avatar-input" accept="image/*" onchange="previewEsalvarFoto(event)">
            </div>

            <!-- Dados Pessoais -->
            <form id="profile-form" onsubmit="salvarPerfil(event)">
                <div class="form-group">
                    <label for="user-name">Nome Completo</label>
                    <input type="text" id="user-name" required placeholder="Digite seu nome completo">
                </div>

                <div class="form-group">
                    <label for="user-email">E-mail de Contato</label>
                    <input type="email" id="user-email" required placeholder="seu.email@exemplo.com">
                </div>

                <div class="form-group">
                    <label for="user-phone">Telefone / WhatsApp</label>
                    <input type="tel" id="user-phone" required placeholder="(00) 99999-9999">
                </div>

                <div class="form-group">
                    <label for="user-bio">Sobre Mim (Biografia)</label>
                    <textarea id="user-bio" placeholder="Conte um pouco sobre sua rotina, sua casa e por que deseja adotar um companheiro..."></textarea>
                </div>

                <button type="submit" class="btn-save-profile">Salvar Alterações</button>
            </form>
        </div>
    </main>

    <script>
        // Função para carregar os dados salvos do LocalStorage assim que abrir a página
        function carregarDadosPerfil() {
            const perfilSalvo = JSON.parse(localStorage.getItem('perfilAdotante'));

            if (perfilSalvo) {
                if (perfilSalvo.nome) document.getElementById('user-name').value = perfilSalvo.nome;
                if (perfilSalvo.email) document.getElementById('user-email').value = perfilSalvo.email;
                if (perfilSalvo.telefone) document.getElementById('user-phone').value = perfilSalvo.telefone;
                if (perfilSalvo.bio) document.getElementById('user-bio').value = perfilSalvo.bio;
                
                // Se houver uma foto salva em string Base64, carrega nos previews
                if (perfilSalvo.foto) {
                    atualizarPreviewsFoto(perfilSalvo.foto);
                }
            }
        }

        // Processa o arquivo de imagem e transforma em string Base64 para salvar localmente
        function previewEsalvarFoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    atualizarPreviewsFoto(base64Image);
                    
                    // Salva temporariamente a foto na estrutura do perfil
                    salvarFotoNoStorage(base64Image);
                };
                reader.readAsDataURL(file);
            }
        }

        function atualizarPreviewsFoto(imagemBase64) {
            // Atualiza a foto grande do perfil
            const preview = document.getElementById('avatar-preview');
            preview.innerHTML = `<img src="${imagemBase64}" style="width:100%; height:100%; object-fit:cover;">`;

            // Opcional: Atualiza o ícone do avatar pequenininho do Header
            const miniPreview = document.getElementById('header-avatar-mini');
            if (miniPreview) {
                miniPreview.innerHTML = `<img src="${imagemBase64}" style="width:24px; height:24px; border-radius:50%; object-fit:cover; display:inline-block;">`;
            }
        }

        function salvarFotoNoStorage(base64Image) {
            let perfil = JSON.parse(localStorage.getItem('perfilAdotante')) || {};
            perfil.foto = base64Image;
            localStorage.setItem('perfilAdotante', JSON.stringify(perfil));
        }

        // Salva os inputs de texto no LocalStorage
        function salvarPerfil(event) {
            event.preventDefault();

            let perfil = JSON.parse(localStorage.getItem('perfilAdotante')) || {};
            
            perfil.nome = document.getElementById('user-name').value;
            perfil.email = document.getElementById('user-email').value;
            perfil.telefone = document.getElementById('user-phone').value;
            perfil.bio = document.getElementById('user-bio').value;

            localStorage.setItem('perfilAdotante', JSON.stringify(perfil));

            // Exibe a mensagem de sucesso na tela temporariamente
            const alerta = document.getElementById('success-alert');
            alerta.style.display = 'block';
            setTimeout(() => {
                alerta.style.display = 'none';
            }, 3000);
        }

        // Inicializa os dados na tela ao carregar a página
        window.onload = function() {
            carregarDadosPerfil();
        };
    </script>
</body>
</html>
