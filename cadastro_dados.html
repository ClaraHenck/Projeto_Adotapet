<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet - Completar Cadastro</title>
    <style>
        body { background-color: #f4f7f6; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .cadastro-container { max-width: 500px; width: 100%; margin: 30px auto; padding: 30px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; box-sizing: border-box; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; color: #2c3e50; font-weight: 600; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .btn-salvar { display: block; width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; background: #4CAF50; color: white; transition: background 0.2s; }
        .btn-salvar:hover { background: #43a047; }
        .avatar-preview { width: 100px; height: 100px; border-radius: 50%; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; color: #7f8c8d; font-size: 12px; overflow: hidden; background-size: cover; background-position: center; }
    </style>
</head>
<body>

    <div class="cadastro-container">
        🐾 <h2>Completar Perfil</h2>
        <p>Preencha os dados do seu perfil para finalizar o acesso.</p>

        <div id="preview-foto" class="avatar-preview">Foto de Perfil</div>

        <form id="form-dados" onsubmit="salvarPerfil(event)">
            <div class="form-group">
                <label for="foto">Foto de Perfil</label>
                <input type="file" id="foto" accept="image/*" onchange="carregarPreview(event)">
            </div>

            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="email-contato">E-mail de Contato</label>
                <input type="email" id="email-contato" required readonly style="background-color: #eee; cursor: not-allowed;">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp</label>
                <input type="tel" id="telefone" required placeholder="(19) 98107-4554">
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" required placeholder="000.000.000-00">
            </div>

            <button type="submit" class="btn-salvar">Salvar e Entrar</button>
        </form>
    </div>

    <script>
        let fotoBase64 = "";
        let emailUsuarioAtivo = "";

        window.onload = function() {
            // Identifica quem é o usuário conectado na sessão atual
            emailUsuarioAtivo = localStorage.getItem('usuarioLogadoEmail');
            
            if (!emailUsuarioAtivo) {
                alert("Sessão expirada. Faça login novamente.");
                window.location.assign('login.html');
                return;
            }

            document.getElementById('email-contato').value = emailUsuarioAtivo;

            // Se o usuário já tiver dados salvos antes, preenche a tela automaticamente para ele editar
            const dadosExistentes = localStorage.getItem('dados_perfil_' + emailUsuarioAtivo);
            if (dadosExistentes) {
                const dados = JSON.parse(dadosExistentes);
                document.getElementById('nome').value = dados.nome || "";
                document.getElementById('telefone').value = dados.telefone || "";
                document.getElementById('cpf').value = dados.cpf || "";
                if (dados.foto) {
                    const preview = document.getElementById('preview-foto');
                    preview.style.backgroundImage = `url('${dados.foto}')`;
                    preview.innerText = "";
                    fotoBase64 = dados.foto;
                }
            }
        };

        function carregarPreview(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('preview-foto');
                    preview.style.backgroundImage = `url('${e.target.result}')`;
                    preview.innerText = "";
                    fotoBase64 = e.target.result; 
                };
                reader.readAsDataURL(arquivo);
            }
        }

        function salvarPerfil(event) {
            event.preventDefault();

            if (!emailUsuarioAtivo) return;

            const dadosPerfil = {
                nome: document.getElementById('nome').value.trim(),
                emailContato: emailUsuarioAtivo,
                telefone: document.getElementById('telefone').value.trim(),
                cpf: document.getElementById('cpf').value.trim(),
                foto: fotoBase64
            };

            try {
                // Salva atrelando as informações diretamente ao e-mail correspondente
                localStorage.setItem('dados_perfil_' + emailUsuarioAtivo, JSON.stringify(dadosPerfil));
                
                alert("Perfil salvo com sucesso!");
                window.location.assign('index.html');
            } catch (error) {
                console.error(error);
                alert("Erro ao salvar dados. Tente escolher uma foto de perfil menor.");
            }
        }
    </script>
</body>
</html>
