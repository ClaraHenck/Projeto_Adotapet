<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet - Mensagens</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos Gerais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #fcf8f5;
        }

        /* TELA DE INÍCIO (Layout de Seleção com Patinhas) */
        .welcome-screen {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Fundo Decorativo de Patinhas */
        .paw-bg {
            position: absolute;
            font-size: 2rem;
            color: rgba(255, 122, 0, 0.08);
            user-select: none;
            z-index: 1;
        }
        .p1 { top: 10%; left: 5%; transform: rotate(-15deg); }
        .p2 { top: 15%; right: 8%; transform: rotate(25deg); font-size: 3rem; }
        .p3 { bottom: 12%; left: 10%; transform: rotate(45deg); }
        .p4 { bottom: 20%; right: 7%; transform: rotate(-35deg); }
        .p5 { top: 45%; left: 4%; transform: rotate(20deg); }

        .welcome-content {
            position: relative;
            z-index: 2;
        }

        .welcome-screen h2 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .welcome-screen p {
            color: #666;
            margin-bottom: 30px;
        }

        /* Grid de Seleção de Contatos */
        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .contact-card {
            background: #fff;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .contact-card:hover {
            border-color: #ff7a00;
            transform: translateY(-4px);
            box-shadow: 0 4px 12px rgba(255, 122, 0, 0.1);
        }

        .contact-avatar {
            width: 60px;
            height: 60px;
            background: #fff3e0;
            color: #ff7a00;
            font-size: 1.8rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }

        .contact-card h3 {
            margin: 0;
            font-size: 1.1rem;
            color: #222;
        }

        .contact-card .pet-info {
            font-size: 0.85rem;
            color: #666;
            background: #e1f5fe;
            color: #0288d1;
            padding: 3px 8px;
            border-radius: 20px;
        }

        /* TELA DO CHAT ATIVO */
        .chat-container {
            max-width: 1000px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: 550px;
            border: 1px solid #eee;
            overflow: hidden;
        }

        .chat-sidebar {
            background: #f8f9fa;
            border-right: 1px solid #eee;
            padding: 20px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-voltar {
            background: #6c757d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-voltar:hover { background: #5a6268; }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff7a00;
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .chat-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #eef0f2;
            cursor: pointer;
            transition: 0.2s;
        }

        .chat-item:hover, .chat-item.active {
            border-color: #ff7a00;
            background: #fff9f5;
        }

        .chat-item h4 { margin: 0 0 5px 0; color: #222; font-size: 0.95rem; }
        .chat-item p { margin: 0; color: #666; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .chat-item .pet-tag {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 5px;
        }

        .chat-main {
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #fafafa;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fdfdfd;
            max-height: 350px;
        }

        .msg-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg-received {
            background: #f1f3f5;
            color: #333;
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .msg-sent {
            background: #ff7a00;
            color: white;
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .chat-input-area button {
            background: #ff7a00;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input-area button:hover { background: #e06c00; }

        .role-badge {
            background: #fff0f0;
            color: #ff4757;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }
        .role-badge.ong { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
