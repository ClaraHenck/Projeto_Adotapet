<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet - Painel da ONG</title>
    <link rel="stylesheet" href="perfil.css"> <!-- Reutiliza seus estilos base de estrutura -->
    <style>
        /* Estilos exclusivos do Painel da ONG */
        .painel-header {
            background: #fff5ec;
            border-left: 5px solid #ff7a00;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .infos-resumo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card-metrica {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            text-align: center;
        }

        .card-metrica h3 {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }

        .card-metrica p {
            margin: 10px 0 0 0;
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff7a00;
        }

        .btn-acao-principal {
            background-color: #28a745;
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-acao-principal:hover {
            background-color: #218838;
        }

        .btn-acao-principal:active {
            transform: scale(0.98);
        }

        .lista-pets-ong {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 25px;
        }

        .topo-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .grid-mini-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .mini-card-pet {
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            background: #fafafa;
        }

        .mini-card-pet img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .mini-card-body {
            padding: 10px;
            text-align: center;
        }

        .mini-card-body h4 {
            margin: 0 0 5px 0;
            font-size: 1rem;
        }

        .mini-card-body p {
            margin: 0;
            font-size: 0.85rem;
            color: #777;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho / Menu de Navegação Padronizado -->
    <header class="navbar">
        <div class="logo">🐾 AdotaPet</div>
        <nav class="menu" id="menu-navegacao">
            <a href="index.html">Início</a>
            <a href="adotar.html">Adotar</a>
            <a href="#">Mapa</a>
            <a href="#">Candidaturas</a>
            <a href="#">Mensagens</a>
            <a href="minha_ong.html" class="active">Minha ONG</a>
        </nav>
    </header>

    <!-- Conteúdo Principal do Painel -->
    <main class="container">
        
        <!-- Bloco de Boas-Vindas Dinâmico -->
        <div class="painel-header">
            <div>
                <h1 id="txtBoasVindasOng" style="margin: 0; font-size: 1.6rem; color: #222;">Painel da Instituição</h1>
                <p id="txtCidadeOng" style="margin: 5px 0 0 0; color: #666; font-size: 0.95rem;">Carregando localização...</p>
            </div>
            <!-- BOTÃO SOLICITADO: Link direto para a tela de publicar animal -->
            <a href="cadastrarAnimal.html" class="btn-acao-principal">
                ➕ Cadastrar Animal
            </a>
        </div>

        <!-- Módulos de Métricas Rápidas -->
        <div class="infos-resumo">
            <div class="card-metrica">
                <h3>Capacidade Cadastrada</h3>
                <p id="lblCapacidade">--</p>
            </div>
            <div class="card-metrica">
                <h3>Foco de Atuação</h3>
                <p id="lblFoco" style="font-size: 1.2rem; padding-top: 5px;">--</p>
            </div>
            <div class="card-metrica">
                <h3>Animais Publicados</h3>
                <p id="lblTotalPets">0</p>
            </div>
        </div>

        <!-- Área de Exibição dos Animais da própria ONG -->
        <div class="lista-pets-ong">
            <div class="topo-lista">
                <h2 style="margin: 0; font-size: 1.2rem; color: #333;">🐾 Nossos Animais para Adoção</h2>
            </div>
            
            <div class="grid-mini-cards" id="containerMeusPets">
                <!-- Inserido dinamicamente via JS -->
            </div>
        </div>

    </main>

    <script>
        window.onload = function() {
            // Segurança: Se tentar entrar sem ser ONG, manda de volta para a home
            const perfilTipo = localStorage.getItem('perfilTipo');
            if (perfilTipo !== 'ong') {
                window.location.href = 'index.html';
                return;
            }

            // Recupera as informações inseridas pela ONG na tela de Perfil
            const nomeOng = localStorage.getItem('ong_nome') || "Associação de Proteção";
            const cidade = localStorage.getItem('user_cidade') || "Não informada";
            const estado = localStorage.getItem('user_estado') || "";
            const capacidade = localStorage.getItem('ong_capacidade') || "De 20 a 50 animais";
            const foco = localStorage.getItem('ong_foco') || "🐾 Ambos (Cães e Gatos)";

            // Atualiza os textos da tela com as informações salvas do formulário
            document.getElementById('txtBoasVindasOng').innerText = `🏢 ${nomeOng}`;
            document.getElementById('txtCidadeOng').innerText = `📍 Localização: ${cidade} - ${estado}`;
            document.getElementById('lblCapacidade').innerText = capacidade;
            document.getElementById('lblFoco').innerText = foco;

            carregarAnimaisDaOng(nomeOng);
        };

        // Carrega apenas os animais criados por essa respectiva ONG
        function carregarAnimaisDaOng(nomeDaOng) {
            const container = document.getElementById("containerMeusPets");
            const lblTotal = document.getElementById("lblTotalPets");
            
            // Carrega os bichos guardados no localStorage global
            const todosOsAnimais = JSON.parse(localStorage.getItem('bancoAnimaisDigitais')) || [];
            
            // Filtra mantendo apenas os animais criados por esta ONG específica
            const meusAnimais = todosOsAnimais.filter(pet => pet.ongResponsavel === nomeDaOng);

            lblTotal.innerText = meusAnimais.length;

            if (meusAnimais.length === 0) {
                container.innerHTML = `<p style="grid-column: span 3; text-align: center; color: #888; padding: 20px 0;">Você ainda não cadastrou nenhum animalzinho. Clique em "Cadastrar Animal" acima!</p>`;
                return;
            }

            // Renderiza na tela os mini cards
            container.innerHTML = "";
            meusAnimais.forEach(pet => {
                container.innerHTML += `
                    <div class="mini-card-pet">
                        <img src="${pet.imagem}" alt="${pet.nome}">
                        <div class="mini-card-body">
                            <h4>${pet.nome}</h4>
                            <p>${pet.tipo} (${pet.idade})</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>

</body>
</html>
