<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet - Encontre seu Companheiro</title>
    <link rel="stylesheet" href="adotar.css">
    <style>
        /* Cursor de clique para os cards */
        .card { cursor: pointer; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="left-brand-box">
            <img src="C:\Users\42619841801\Desktop\inicio_HTML\img\Captura de tela 2026-05-13 110314.png" alt="Foto de Perfil" class="brand-avatar">
            <div class="logo">🐾 AdotaPet</div>
        </div>
        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="adotar.html" class="active">Adotar</a>
            <a href="#">Mapa</a>
            <a href="candidaturas.html">Candidaturas</a>
            <a href="#">Mensagens</a>
        </nav>
    </header>

    <main class="container">
        <div class="header-titulo">
            <h1>Encontre seu Companheiro</h1>
            <p>27 cães disponíveis para adoção</p>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="🔍 Buscar por nome, raça ou cidade...">
            <button class="btn-filters">🎛️ Filtros</button>
        </div>

        <div class="cards-grid">
            <div class="card" data-id="luna">
                <div class="card-img-box">
                    <span class="badge-disponivel">Disponível</span>
                    <button class="btn-favorito">🤍</button>
                    <img src="C:\Users\42619841801\Desktop\inicio_HTML\img\foto de gato - Pesquisar Imagens_files\photo-1514888286974-6c03e2ca1dba.jpg" alt="Luna">
                </div>
                <div class="card-info">
                    <div class="pet-detalhes">
                        <div class="pet-nome">Luna</div>
                        <div class="pet-raca">Gato SRD</div>
                    </div>
                    <div class="pet-idade">1 ano</div>
                </div>
            </div>

            <div class="card" data-id="simba">
                <div class="card-img-box">
                    <span class="badge-disponivel">Disponível</span>
                    <button class="btn-favorito">🤍</button>
                    <img src="C:\Users\42619841801\Desktop\inicio_HTML\img\foto de gato - Pesquisar Imagens_files\photo-1574158622682-e40e69881006.jpg" alt="Simba">
                </div>
                <div class="card-info">
                    <div class="pet-detalhes">
                        <div class="pet-nome">Simba</div>
                        <div class="pet-raca">Gato</div>
                    </div>
                    <div class="pet-idade">2 anos</div>
                </div>
            </div>

            <div class="card" data-id="felix">
                <div class="card-img-box">
                    <span class="badge-disponivel">Disponível</span>
                    <button class="btn-favorito">🤍</button>
                    <img src="https://images.unsplash.com/photo-1533743983669-94fa5c4338ec?w=400" alt="Felix">
                </div>
                <div class="card-info">
                    <div class="pet-detalhes">
                        <div class="pet-nome">Felix</div>
                        <div class="pet-raca">Gato Maine Coon</div>
                    </div>
                    <div class="pet-idade">3 anos</div>
                </div>
            </div>

            <div class="card" data-id="baruck">
                <div class="card-img-box">
                    <span class="badge-disponivel">Disponível</span>
                    <button class="btn-favorito">🤍</button>
                    <img src="https://images.unsplash.com/photo-1605897472359-85e4b94d685d?w=400" alt="Baruck">
                </div>
                <div class="card-info">
                    <div class="pet-detalhes">
                        <div class="pet-nome">Baruck</div>
                        <div class="pet-raca">Golden</div>
                    </div>
                    <div class="pet-idade">3 anos</div>
                </div>
            </div>
            
            </div>
    </main>

    <script>
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.closest('.btn-favorito')) return;
                
                const petId = card.getAttribute('data-id');
                const petNome = card.querySelector('.pet-nome').innerText;
                
                // Salva o nome para usar na página de candidaturas depois
                localStorage.setItem('petSelecionadoNome', petNome);
                
                // Abre a página de detalhes!
                window.location.href = `detalhes.html?id=${petId}`;
            });
        });
    </script>
</body>
</html>
