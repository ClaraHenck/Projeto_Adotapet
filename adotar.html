<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet - Encontre seu Companheiro</title>
    <link rel="stylesheet" href="../styles.css">
     <script src="footer.js"></script>
     
</head>
<body>

    <!-- CABEÇALHO PADRÃO -->
    <header class="main-header">
        <div class="logo">
            <span class="paw-icon">🐾</span>
            <h1>AdotaPet</h1>
        </div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="adotar.html" class="active">Adotar</a>
            <a href="mapa.html">Mapa</a>
            <a href="candidaturas.html">Candidaturas</a>
            <div class="profile-section">
                <span class="profile-pic">👤</span>
                <span class="meu_perfil.html">MEU PERFIL</span>
            </div>
            <a href="login.html" class="">Sair</a>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
        <main class="content-wrapper">
        <h2 class="page-title">Encontre seu Companheiro</h2>
        <p class="subtitle">Disponíveis para adoção</p>

        <div class="search-container">
            <input type="text" id="search-input" oninput="filtrarAnimais()" placeholder="🔍 Buscar por nome, raça...">
            <button class="btn-filter">🎛️ Filtros</button>
        </div>

        <!-- O GRID COMEÇA VAZIO E É PREENCHIDO PELO JS -->
        <div class="pet-grid" id="pet-grid"></div>
    </main>

    <!-- O MODAL PERMANECE IGUAL (mantenha a estrutura <div id="adoption-modal"> aqui se desejar) -->

    <script>
        let petSelecionado = {};

        // Lista padrão inicial (caso o banco local esteja completamente vazio)
        const animaisIniciais = [
            { id: 1, nome: "Felix", tipo: "Gato", raca: "Maine Coon", idade: "3 anos", descricao: "Muito brincalhão, se dá bem com outros gatos." },
            { id: 2, nome: "Baruck", tipo: "Cão", raca: "Golden Retriever", idade: "3 anos", descricao: "Dócil, adora correr ao ar livre e buscar bolinhas." }
        ];

        // Carrega e renderiza os animais salvos
        function renderizarAnimais() {
            const grid = document.getElementById('pet-grid');
            
            // Busca os animais da ONG. Se não houver nenhum, salva os 2 iniciais para a tela não ficar vazia
            let lista = JSON.parse(localStorage.getItem('animaisDisponiveis'));
            if (!lista) {
                localStorage.setItem('animaisDisponiveis', JSON.stringify(animaisIniciais));
                lista = animaisIniciais;
            }

            if (lista.length === 0) {
                grid.innerHTML = '<p class="no-data">Nenhum animal disponível para adoção no momento.</p>';
                return;
            }

            grid.innerHTML = lista.map(pet => `
                <div class="pet-card" data-nome="${pet.nome.toLowerCase()}" data-raca="${pet.raca.toLowerCase()}">
                    <div class="card-image-placeholder">
                        ${pet.tipo === 'Gato' ? '🐱' : '🐶'} ${pet.nome}
                    </div>
                    <div class="card-info">
                        <h3>${pet.nome}</h3>
                        <p>${pet.tipo} ${pet.raca} • ${pet.idade}</p>
                        <button class="btn-adopt" onclick="abrirModal('${pet.nome}', '${pet.raca}', '${pet.idade}', '${pet.descricao}')">Adotar um Animal</button>
                    </div>
                </div>
            `).join('');
        }

        // Sistema de busca em tempo real adaptado
        function filtrarAnimais() {
            const termoBusca = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.pet-card');

            cards.forEach(card => {
                const nome = card.getAttribute('data-nome');
                const raca = card.getAttribute('data-raca');
                card.style.display = (nome.includes(termoBusca) || raca.includes(termoBusca)) ? "block" : "none";
            });
        }

        // Funções do Modal (abrirModal, fecharModal, enviarCandidatura) permanecem EXATAMENTE iguais ao passo anterior.
        // Certifique-se de chamar renderizarAnimais ao carregar a página:
        window.onload = function() {
            renderizarAnimais();
        };
    </script>

</body>
</html>
