<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet - Encontre seu Companheiro</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="footer.js"></script>
    <style>
        /* Estilos rápidos para o Modal funcionar com base no seu padrão */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white; padding: 30px;
            border-radius: 16px; max-width: 500px; width: 90%;
            position: relative;
        }
        .btn-submit {
            background-color: #00C1DE; color: white;
            border: none; padding: 12px 20px;
            border-radius: 25px; font-weight: 600;
            cursor: pointer; margin-top: 15px; width: 100%;
        }
        .close-modal {
            position: absolute; right: 20px; top: 15px;
            cursor: pointer; font-size: 20px;
        }
        /* Estilização para garantir que as fotos fiquem perfeitas nos cards */
        .pet-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
            display: block;
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO PADRÃO -->
    <header class="main-header">
        <div class="logo">
            <span class="paw-icon">🐾</span>
            <h1>AdotaPet</h1>
        </div>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="adotar.html" class="active">Adotar</a>
            <a href="mapa.html">Mapa</a>
            <a href="candidaturas.html">Candidaturas</a>
            <div class="profile-section">
                <span class="profile-pic">👤</span>
                <span class="meu_perfil.html">MEU PERFIL</span>
            </div>
            <a href="login.html">Sair</a>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="content-wrapper">
        <h2 class="page-title">Encontre seu Companheiro</h2>
        <p class="subtitle">Disponíveis para adoção</p>

        <div class="search-container">
            <input type="text" id="search-input" oninput="filtrarAnimais()" placeholder="🔍 Buscar por nome, raça...">
            <button class="btn-filter">🎛️ Filtros</button>
        </div>

        <div class="pet-grid" id="pet-grid"></div>
    </main>

    <!-- INTERFACE DO MODAL DE ADOÇÃO -->
    <div id="adoption-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="fecharModal()">&times;</span>
            <h2 id="modal-pet-nome">Nome do Animal</h2>
            <p id="modal-pet-detalhes" style="color: #7A7E85; margin: 10px 0;"></p>
            <p id="modal-pet-descricao"></p>
            <button class="btn-submit" onclick="enviarCandidatura()">Confirmar Interesse em Adotar</button>
        </div>
    </div>

    <script>
        let petSelecionado = {};

        // Lista de animais expandida com imagens reais de alta resolução
        const animaisIniciais = [
            { id: 1, nome: "Felix", tipo: "Gato", raca: "Maine Coon", idade: "3 anos", imagem: "https://unsplash.com", descricao: "Muito brincalhão, super dócil e se dá bem com outros gatos." },
            { id: 2, nome: "Baruck", tipo: "Cão", raca: "Golden Retriever", idade: "3 anos", imagem: "https://unsplash.com", descricao: "Dócil, muito ativo, adora correr ao ar livre e buscar bolinhas." },
            { id: 3, nome: "Luna", tipo: "Gato", raca: "Persa", idade: "1 ano", imagem: "https://unsplash.com", descricao: "Muito carinhosa, calma, perfeita para companhia e ama dormir no sofá." },
            { id: 4, nome: "Pipoca", tipo: "Cão", raca: "Vira-lata", idade: "2 anos", imagem: "https://unsplash.com", descricao: "Super energético, brincalhão, resgatado das ruas e extremamente leal." },
            { id: 5, nome: "Mel", tipo: "Cão", raca: "Poodle", idade: "4 anos", imagem: "https://unsplash.com", descricao: "De porte pequeno, silenciosa, muito inteligente e ideal para apartamentos." },
            { id: 6, nome: "Simba", tipo: "Gato", raca: "Siamês", idade: "2 anos", imagem: "https://unsplash.com", descricao: "Muito comunicativo, ativo, adora seguir o dono pela casa inteira." }
        ];

        function renderizarAnimais() {
            const grid = document.getElementById('pet-grid');
            
            // Força a atualização do LocalStorage caso os dados antigos com apenas 2 animais ainda existam
            let lista = JSON.parse(localStorage.getItem('animaisDisponiveis'));
            if (!lista || lista.length <= 2) {
                localStorage.setItem('animaisDisponiveis', JSON.stringify(animaisIniciais));
                lista = animaisIniciais;
            }

            if (lista.length === 0) {
                grid.innerHTML = '<p class="no-data">Nenhum animal disponível para adoção no momento.</p>';
                return;
            }

            grid.innerHTML = lista.map(pet => `
                <div class="pet-card" data-nome="${pet.nome.toLowerCase()}" data-raca="${pet.raca.toLowerCase()}">
                    <img src="${pet.imagem || 'https://placeholder.com'}" alt="${pet.nome}">
                    <div class="card-info">
                        <h3>${pet.nome}</h3>
                        <p>${pet.tipo} ${pet.raca} • ${pet.idade}</p>
                        <button class="btn-adopt" onclick="abrirModal('${pet.nome}', '${pet.tipo}', '${pet.raca}', '${pet.idade}', '${pet.descricao}')">Adotar um Animal</button>
                    </div>
                </div>
            `).join('');
        }

        function filtrarAnimais() {
            const termoBusca = document.getElementById('search-input').value.toLowerCase();
            const cards = document.querySelectorAll('.pet-card');

            cards.forEach(card => {
                const nome = card.getAttribute('data-nome');
                const raca = card.getAttribute('data-raca');
                card.style.display = (nome.includes(termoBusca) || raca.includes(termoBusca)) ? "block" : "none";
            });
        }

        /* FUNÇÕES DO MODAL INTEGRADO */
        function abrirModal(nome, tipo, raca, idade, descricao) {
            petSelecionado = { nome, tipo, raca, idade };
            document.getElementById('modal-pet-nome').innerText = `Adotar ${nome}`;
            document.getElementById('modal-pet-detalhes').innerText = `${tipo} • ${raca} • ${idade}`;
            document.getElementById('modal-pet-descricao').innerText = descricao;
            document.getElementById('adoption-modal').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('adoption-modal').style.display = 'none';
        }

        function enviarCandidatura() {
            let listaCandidaturas = JSON.parse(localStorage.getItem('minhasCandidaturas')) || [];
            
            listaCandidaturas.push({
                petNome: petSelecionado.nome,
                petEspecie: `${petSelecionado.tipo} (${petSelecionado.raca})`,
                dataEnvio: new Date().toLocaleDateString('pt-BR'),
                status: "analise"
            });

            localStorage.setItem('minhasCandidaturas', JSON.stringify(listaCandidaturas));
            window.location.href = "candidaturas.html";
        }

        window.onload = function() {
            renderizarAnimais();
        };
    </script>
</body>
</html>
