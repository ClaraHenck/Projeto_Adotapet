<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastrar ONG</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    padding:40px;
}

.card{
    background:white;
    width:600px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

h1{
    margin-bottom:20px;
}

input, textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
}

textarea{
    height:100px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#06b6d4;
    color:white;
    cursor:pointer;
    font-size:16px;
}
</style>
</head>
<body>

<div class="card">

    <h1>Cadastrar ONG</h1>

    <input type="text" id="nome" placeholder="Nome da ONG">

    <input type="text" id="endereco" placeholder="Endereço completo">

    <input type="text" id="telefone" placeholder="Telefone">

    <input type="email" id="email" placeholder="Email">

    <textarea id="descricao"
        placeholder="Descrição da ONG"></textarea>

    <button onclick="salvarOng()">
        Cadastrar ONG
    </button>

</div>

<script>
function salvarOng() {

    const nome = document.getElementById("nome").value;
    const endereco = document.getElementById("endereco").value;

    if (!nome || !endereco) {
        alert("Preencha tudo!");
        return;
    }

    let ongs = JSON.parse(localStorage.getItem("ongs")) || [];

    ongs.push({
        nome: nome,
        endereco: endereco
    });

    localStorage.setItem("ongs", JSON.stringify(ongs));

    // 🔥 volta para o mapa
    window.location.href = "mapa.html";
}
</script>


</body>
</html>
