<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdotaPet - Gerenciar Animais</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --danger-color: #ef4444;
            --text-color: #1f2937;
            --bg-color: #f3f4f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 { margin-top: 0; color: var(--primary-color); }

        /* Estilização da Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th { background-color: #f8fafc; font-weight: 600; }

        /* Botões de Ação */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-edit { background-color: var(--primary-color); color: white; margin-right: 5px; }
        .btn-edit:hover { background-color: #1d4ed8; }
        
        .btn-delete { background-color: var(--danger-color); color: white; }
        .btn-delete:hover { background-color: #dc2626; }

        /* Modal de Edição (Escondido por padrão) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background-color: #9ca3af; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gerenciar Animais Postados</h2>
    <p>Visualize, altere informações ou remova pets da plataforma.</p>

    <!-- Tabela onde os animais serão listados via JS -->
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Espécie</th>
                <th>Idade</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-animais">
            <!-- Linhas inseridas dinamicamente pelo JavaScript -->
        </tbody>
    </table>
</div>

<!-- Modal para Alterar Dados -->
<div class="modal-overlay" id="modal-editar">
    <div class="modal">
        <h3>Alterar Dados do Pet</h3>
        <form id="form-editar">
            <input type="hidden" id="edit-id">
            <div class="form-group">
                <label for="edit-nome">Nome</label>
                <input type="text" id="edit-nome" required>
            </div>
            <div class="form-group">
                <label for="edit-especie">Espécie</label>
                <input type="text" id="edit-especie" required>
            </div>
            <div class="form-group">
                <label for="edit-idade">Idade</label>
                <input type="text" id="edit-idade" required>
            </div>
            <div class="form-group">
                <label for="edit-status">Status</label>
                <select id="edit-status">
                    <option value="Disponível">Disponível</option>
                    <option value="Adotado">Adotado</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" id="btn-fechar-modal">Cancelar</button>
                <button type="submit" class="btn btn-edit">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>


<script>

    import { obterAnimais, excluirAnimal, alterarAnimal } from './gerenciar-animais.js';

const tabela = document.getElementById('tabela-animais');
const modal = document.getElementById('modal-editar');
const formEditar = document.getElementById('form-editar');
const btnFecharModal = document.getElementById('btn-fechar-modal');

// Função para renderizar a tabela na tela
function renderizarTabela() {
    const animais = obterAnimais();
    tabela.innerHTML = ''; // Limpa a tabela

    if (animais.length === 0) {
        tabela.innerHTML = `<tr><td colspan="5" style="text-align:center;">Nenhum animal cadastrado ainda.</td></tr>`;
        return;
    }

    animais.forEach(animal => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${animal.nome}</td>
            <td>${animal.especie}</td>
            <td>${animal.idade}</td>
            <td><strong>${animal.status}</strong></td>
            <td>
                <button class="btn btn-edit" data-id="${animal.id}">Alterar</button>
                <button class="btn btn-delete" data-id="${animal.id}">Excluir</button>
            </td>
        `;
        tabela.appendChild(tr);
    });

    adicionarEventosBotoes();
}

// Escuta os cliques nos botões de Editar e Excluir
function adicionarEventosBotoes() {
    // Botões de Excluir
    document.querySelectorAll('.btn-delete').forEach(botao => {
        botao.onclick = (e) => {
            const id = e.target.getAttribute('data-id');
            if (confirm("Tem certeza que deseja remover este animal permanentemente?")) {
                excluirAnimal(id);
                renderizarTabela(); // Atualiza a interface
            }
        };
    });

    // Botões de Alterar (Abrir Modal)
    document.querySelectorAll('.btn-edit').forEach(botao => {
        botao.onclick = (e) => {
            const id = e.target.getAttribute('data-id');
            const animais = obterAnimais();
            const animal = animais.find(a => a.id === id);

            if (animal) {
                // Preenche o formulário do modal com os dados atuais
                document.getElementById('edit-id').value = animal.id;
                document.getElementById('edit-nome').value = animal.nome;
                document.getElementById('edit-especie').value = animal.especie;
                document.getElementById('edit-idade').value = animal.idade;
                document.getElementById('edit-status').value = animal.status;

                modal.classList.add('active'); // Abre o modal
            }
        };
    });
}

// Fechar Modal
btnFecharModal.onclick = () => modal.classList.remove('active');

// Salvar Alterações do Formulário
formEditar.onsubmit = (e) => {
    e.preventDefault();
    const id = document.getElementById('edit-id').value;
    const novosDados = {
        nome: document.getElementById('edit-nome').value,
        especie: document.getElementById('edit-especie').value,
        idade: document.getElementById('edit-idade').value,
        status: document.getElementById('edit-status').value
    };

    alterarAnimal(id, novosDados);
    modal.classList.remove('active'); // Fecha janela
    renderizarTabela(); // Atualiza a lista na tela
};

// Inicializa a tabela ao carregar a página
renderizarTabela();

</script>
</body>
</html>
